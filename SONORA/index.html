/* ---- profile/social layer ---- */
let PROFILE_CACHE={};
let PROFILE_TAB='tracks';
let PROFILE_EDIT={avatarData:null,backgroundData:null};
function profileFallback(){
  const u=API.user||axSes()||{};
  return {user:{id:u.id,name:u.name||u.username||'You',username:u.username||'you',avatarUrl:u.avatarUrl||'',backgroundUrl:u.backgroundUrl||'',bio:u.bio||'',createdAt:u.createdAt||''},viewerIsOwner:true,following:false,followers:0,followingCount:0,trackCount:0,playlistCount:0,playCount:0,tracks:T.filter(x=>x.mine&&x.serverId),playlists:[]};
}
async function fetchProfile(key){
  const requested=decodeURIComponent(String(key||'').trim()).replace(/^u:/i,'').replace(/^@/,'').trim();
  const self=API.user||{};
  const own=!requested || requested.toLowerCase()==='me' || String(self.id||'')===requested || String(self.username||'').toLowerCase()===requested.toLowerCase();
  const raw=own?(self.username||self.id||'me'):requested;
  const cacheKey=own?'me':raw;
  const hit=PROFILE_CACHE[cacheKey];if(hit&&Date.now()-(hit._at||0)<8000)return hit;
  if(!API.online)throw new Error('SONORA server is offline — cannot load another profile.');
  const candidates=[];
  if(own)candidates.push('me',String(self.username||''),String(self.id||''));
  else {
    candidates.push(raw);
    if(/^\d+$/.test(raw))candidates.push(String(self.username||''));
  }
  // One more authoritative lookup in case local cached account data is stale.
  if(own || !self.id){try{const me=await apiFetch('/api/me');if(me?.user){API.user=me.user;cacheAuth(me.user);candidates.unshift(own?'me':String(me.user.username||''));if(!own&&String(me.user.username||'').toLowerCase()===raw.toLowerCase())candidates.push(String(me.user.id));}}catch(_){}}
  const seen=new Set();let last;
  for(const c0 of candidates){const c=String(c0||'').trim();if(!c||seen.has(c.toLowerCase()))continue;seen.add(c.toLowerCase());
    const urls=[('/api/profile?key='+encodeURIComponent(c)),('/api/users/'+encodeURIComponent(c))];
    for(const url of urls){try{const r=await apiFetch(url);if(r?.profile){r.profile._at=Date.now();PROFILE_CACHE[cacheKey]=r.profile;return r.profile}}catch(err){last=err;}}
  }
  // Search is the final recovery path for a username that was renamed or cached incorrectly.
  try{const q=raw||self.username||self.name||'';if(q){const r=await apiFetch('/api/search?q='+encodeURIComponent(q)+'&limit=20');const users=r?.users||[];const hit=users.find(u=>String(u.id)===String(raw)||String(u.username||'').toLowerCase()===String(raw).toLowerCase()||String(u.name||'').toLowerCase()===String(raw).toLowerCase());if(hit){const r2=await apiFetch('/api/profile?key='+encodeURIComponent(hit.id));if(r2?.profile){r2.profile._at=Date.now();PROFILE_CACHE[cacheKey]=r2.profile;return r2.profile}}}}catch(err){last=err}
  if(own&&self.id){
    const fallback=profileFallback();fallback.user={...fallback.user,...self};fallback._at=Date.now();PROFILE_CACHE[cacheKey]=fallback;return fallback;
  }
  throw last||new Error('Profile not found');
}
const authorAvatar=u=>u?.avatarUrl?`background:url(${u.avatarUrl}) center/cover`:`background:linear-gradient(145deg,var(--bf),var(--mut))`;
function authorMarkup(t){
  const o=t.owner||((API.user&&t.mine)?API.user:null); if(!o)return '';
  const isMe=!!(API.user&&o.id&&String(API.user.id)===String(o.id));
  const label=isMe?'You':(o.name||o.username||'Unknown user');
  return `<button class="author-link" data-a="profile" data-id="${E(o.id||'')}" data-username="${E(o.username||'')}" data-profile-key="${E(o.username||o.id||'')}" aria-label="Open ${E(label)} profile"><span class="mini-author" style="${authorAvatar(o)}">${o.avatarUrl?'':E((o.name||o.username||'?').slice(0,1).toUpperCase())}</span><span>Tác giả · ${E(label)}</span></button>`;
}
function playlistOwnerMarkup(o){if(!o)return '';const isMe=!!(API.user&&o.id&&String(API.user.id)===String(o.id));const label=isMe?'You':(o.name||o.username||'Unknown user');return `<button class="author-link" data-a="profile" data-id="${E(o.id||'')}" data-username="${E(o.username||'')}" data-profile-key="${E(o.username||o.id||'')}" aria-label="Open ${E(label)} profile"><span class="mini-author" style="${authorAvatar(o)}">${o.avatarUrl?'':E((o.name||o.username||'?').slice(0,1).toUpperCase())}</span><span>${E(label)}</span></button>`}
async function renderProfilePage(top){
  const m=$('#main');
  const key=(arg&&String(arg).startsWith('u:'))?String(arg).slice(2):(arg||API.user?.username||API.user?.id||'');
  let p;
  try{p=await fetchProfile(key)}catch(err){m.innerHTML=`<div class="profile-page"><h2>Không tìm thấy hồ sơ</h2><p class="mut">${E(err.message||'Profile not found')}</p><p style="margin-top:14px"><button class="btn" data-a="nav" data-v="home">Về trang chủ</button></p></div>`;return}
  const u=p.user||{}, avatar=u.avatarUrl, bg=u.backgroundUrl;
  const stat=(n,l)=>`<span><b>${Number(n||0).toLocaleString()}</b> ${l}</span>`;
  const isOwner=!!p.viewerIsOwner;
  const followBtn=!isOwner&&API.user?`<button class="btn${p.following?' g':''}" data-a="followuser" data-id="${u.id}">${p.following?'Following ✓':'Follow'}</button>`:'';
  const editBtn=isOwner?`<button class="btn g" data-a="profile-settings">Edit profile</button>`:'';
  let body='';
  if(PROFILE_TAB==='playlists'){
    body=p.playlists?.length?`<div class="grid">${p.playlists.map(pl=>`<div class="card profile-playlist-card" data-a="communityPlaylist" data-id="${pl.id}"><div class="cov" style="${pl.coverUrl?`background:url(${pl.coverUrl}) center/cover`:'background:var(--ho)'}"></div><div style="min-width:0"><b>${E(pl.name)}</b><span>${E(pl.description||pl.artist||'Playlist')} · ${pl.trackIds?.length||0} songs</span>${playlistOwnerMarkup(pl.owner)}</div></div>`).join('')}</div>`:'<p class="mut">Chưa có playlist công khai.</p>';
  }else{
    const localIds=(p.tracks||[]).map(ensureLocalTrack).filter(Boolean);
    p._localTrackIds=localIds;
    body=localIds.length?list(localIds):'<p class="mut">Chưa có bài hát công khai.</p>';
  }
  const initials=E((u.name||u.username||'?').slice(0,1).toUpperCase());
  const bgStyle=bg?`background-image:url(${bg})`:'';
  m.innerHTML=`<div class="profile-page"><div class="profile-hero"><div class="profile-cover" style="${bgStyle}"></div><div class="profile-hero-inner"><div class="profile-avatar" style="${authorAvatar(u)}">${avatar?'':initials}</div><div class="profile-copy"><div class="profile-handle">@${E(u.username||'user')}</div><h1>${E(u.name||u.username||'User')}</h1>${u.bio?`<div class="profile-bio">${E(u.bio)}</div>`:''}<div class="profile-stats">${stat(p.followers,'followers')}${stat(p.followingCount,'following')}${stat(p.trackCount,'songs')}${stat(p.playlistCount,'playlists')}${stat(p.playCount,'plays')}</div><div class="profile-actions">${followBtn}${editBtn}<button class="btn g" data-a="profileShare">Share profile</button><button class="btn g" data-a="nav" data-v="home">Back to home</button></div></div></div></div><div class="profile-tabs"><button class="chip${PROFILE_TAB==='tracks'?' on':''}" data-a="profiletab" data-v="tracks">Songs ${p.trackCount||0}</button><button class="chip${PROFILE_TAB==='playlists'?' on':''}" data-a="profiletab" data-v="playlists">Playlists ${p.playlistCount||0}</button></div><div class="profile-body">${body}</div></div>`;
  document.querySelectorAll('.nv[data-v]').forEach(b=>b.classList.toggle('on',false));
  if(top){m.scrollTop=0;m.classList.remove('in');void m.offsetWidth;m.classList.add('in')}
}
async function refreshOwnProfile(){
  if(!API.online||!API.user)return;
  try{const r=await apiFetch('/api/me');if(r.user){API.user=r.user;cacheAuth(r.user);PROFILE_CACHE={};applyCS();refreshProfileAvatar()}}catch(_){ }
}
function refreshProfileAvatar(){const v=$('.av'),u=API.user||{};if(!v)return;v.textContent=u.avatarUrl?'':((u.name||u.username||'Y')[0]||'Y').toUpperCase();v.style.backgroundImage=u.avatarUrl?`url(${u.avatarUrl})`:'';v.style.backgroundSize='cover';v.style.backgroundPosition='center';}
async function saveProfile(){
  if(!backendReady()){toast('Sign in to save your profile');return}
  const name=($('#pfn')?.value||API.user.name||'').trim(), username=($('#pfu')?.value||API.user.username||'').trim().toLowerCase(), bio=($('#pfb')?.value||'').trim();
  try{const body={name,username,bio}; if(PROFILE_EDIT.avatarData!==null)body.avatarData=PROFILE_EDIT.avatarData; if(PROFILE_EDIT.backgroundData!==null)body.backgroundData=PROFILE_EDIT.backgroundData; const r=await apiFetch('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});API.user=r.user;cacheAuth(API.user);PROFILE_EDIT={avatarData:null,backgroundData:null};PROFILE_CACHE={};refreshProfileAvatar();toast('Profile updated');render()}catch(err){toast(err.message||'Could not update profile')}
}
function profileEditor(){
  const u=API.user||{}, av=PROFILE_EDIT.avatarData||u.avatarUrl||'', bg=PROFILE_EDIT.backgroundData||u.backgroundUrl||'';
  return `<div class="profile-editor glass" style="padding:18px;margin-top:12px"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="profile-image-preview avatar" id="pfAv" style="${av?`background-image:url(${av})`:''}">${av?'':'Avatar'}</div><div><h2 style="margin:0 0 6px">Profile</h2><p class="profile-note">Profile này là tác giả duy nhất của nội dung bạn đăng. Tên hiển thị và username lấy trực tiếp từ tài khoản của bạn.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn g" data-a="profilepick" data-v="avatar">Change avatar</button><button class="btn g" data-a="profileclear" data-v="avatar">Remove</button></div></div></div><input type="file" id="pfAvatarInput" accept="image/*" hidden data-profile-img="avatar"><label class="auth-label" for="pfn">Display name</label><input class="in" id="pfn" value="${E(u.name||'')}" maxlength="120"><label class="auth-label" for="pfu">Username</label><input class="in" id="pfu" value="${E(u.username||'')}" maxlength="20"><label class="auth-label" for="pfb">Bio</label><textarea class="in" id="pfb" rows="4" maxlength="500" placeholder="Tell listeners what you make.">${E(u.bio||'')}</textarea><div class="profile-image-preview" id="pfBg" style="${bg?`background-image:url(${bg})`:''}">${bg?'':'Profile background'}</div><input type="file" id="pfBgInput" accept="image/*" hidden data-profile-img="background"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" data-a="profilepick" data-v="background">Set background</button><button class="btn g" data-a="profileclear" data-v="background">Remove background</button></div><p class="profile-note">Tip: dùng ảnh ngang 1600px trở lên cho background để profile đẹp trên mobile và desktop.</p><div><button class="btn" data-a="profilesave">Save profile</button></div></div>`;
}
function decorateProfileSettings(){
  if(view!=='set'||!API.user)return;
  const h=[...document.querySelectorAll('#main h2')].find(x=>x.textContent.trim()==='Account');
  if(!h||$('#profileEditor'))return;
  h.insertAdjacentHTML('beforebegin',`<h2>Creator profile</h2><p class="mut">Profile của bạn là nơi người nghe xem toàn bộ bài hát và playlist bạn đã đăng.</p>${profileEditor()}`); 
}
function decorateAuthors(){
  refreshProfileAvatar();
  // Song rows/cards: append uploader byline when owner info exists.
  document.querySelectorAll('#main .row[data-a="play"]').forEach(r=>{
    if(r.querySelector('.author-link'))return;
    const i=+r.dataset.i, t=VL[i]&&B[VL[i]]; if(!t)return;
    const target=r.querySelector('.rt1 .song-meta')||r.querySelector('.rt1 span:last-of-type');
    const html=authorMarkup(t); if(target&&html)target.insertAdjacentHTML('afterend',html);
  });
  document.querySelectorAll('#main .card[data-a="qv"]').forEach(c=>{
    if(c.querySelector('.author-link'))return; const id=c.dataset.id,t=B[id]; const html=authorMarkup(t); if(html)c.insertAdjacentHTML('beforeend',html);
  });
  document.querySelectorAll('#main [data-a="opencpl"]').forEach(r=>{
    if(r.querySelector('.author-link'))return; const p=communityPlaylists.find(x=>String(x.id)===String(r.dataset.id)); const html=playlistOwnerMarkup(p?.owner); if(html)r.appendChild(document.createRange().createContextualFragment(html));
  });
}

// Outer render wrapper: profile is async and gets its own full page; all other pages keep the original renderer.
const __renderBeforeProfiles=render;

  if(view==='profile'){await renderProfilePage(top);return}
  __renderBeforeProfiles(top);decorateProfileSettings();decorateAuthors();
};

// Profile clicks + editor uploads.
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-a]'); if(!a)return; const d=a.dataset;
  try{
    if(d.a==='profile'){e.preventDefault();e.stopImmediatePropagation();view='profile';arg='u:'+(d.id||d.profileKey||d.username||'');PROFILE_TAB='tracks';await render(1);return}
    if(d.a==='profileme'){e.preventDefault();e.stopImmediatePropagation();view='profile';arg='u:'+(API.user?.username||API.user?.id||'');PROFILE_TAB='tracks';await render(1);return}
    if(d.a==='profiletab'){PROFILE_TAB=d.v;await render();return}
    if(d.a==='followuser'){e.stopPropagation();const r=await apiJson('/api/users/'+d.id+'/follow',{});PROFILE_CACHE={};PROFILE_TAB='tracks';await render();toast(r.following?'Followed':'Unfollowed');return}
    if(d.a==='profile-settings'){view='set';await render(1);return}
    if(d.a==='profilesave'){await saveProfile();return}
    if(d.a==='profilepick'){const id=d.v==='avatar'?'pfAvatarInput':'pfBgInput';$('#'+id)?.click();return}
    if(d.a==='profileclear'){if(d.v==='avatar')PROFILE_EDIT.avatarData='';else PROFILE_EDIT.backgroundData='';const el=d.v==='avatar'?$('#pfAv'):$('#pfBg');if(el){el.style.backgroundImage='';el.textContent=d.v==='avatar'?'Avatar':'Profile background'}return}
    if(d.a==='profileShare'){const key=(arg&&String(arg).startsWith('u:'))?String(arg).slice(2):(API.user?.username||API.user?.id||'');const url=new URL(location.href);url.hash='profile/'+encodeURIComponent(key);try{await navigator.clipboard?.writeText(url.href)}catch(_){}toast('Profile link copied');return}
    if(d.a==='communityPlaylist'){const cp=communityPlaylists.find(x=>String(x.id)===String(d.id));if(!cp){toast('Playlist not found');return}for(const tid of (cp.trackIds||[])){const src=(communityTracks||[]).find(x=>String(x.id)===String(tid));if(src)ensureLocalTrack(src)}view='pl';arg='c'+d.id;await render(1);return}
  }catch(err){toast(err.message||'Something went wrong')}
});

document.addEventListener('change',e=>{
  const t=e.target;const f=t.files&&t.files[0];if(!f||!t.dataset.profileImg)return;
  const kind=t.dataset.profileImg;rz(f,kind==='background'?1600:700,u=>{PROFILE_EDIT[kind==='background'?'backgroundData':'avatarData']=u;const el=kind==='background'?$('#pfBg'):$('#pfAv');if(el){el.style.backgroundImage=`url(${u})`;el.textContent=''}});t.value='';
});
