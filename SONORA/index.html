  function vipOpenPanel(){let l=$('#vipLayer');if(!l){l=document.createElement('div');l.id='vipLayer';l.innerHTML='<div id="vipPanel" class="glass"></div>';document.body.appendChild(l);l.addEventListener('click',e=>{if(e.target===l)vipClosePanel()});}vipOpen=true;l.classList.add('open');vipRefresh();}
  function vipClosePanel(){vipOpen=false;const l=$('#vipLayer');if(l)l.classList.remove('open');}
  function promptNote(){if(!cur)return toast('Play a track first');const v=prompt('VIP note at '+fmt(au.currentTime||0)+':','');if(v)noteAdd(v)}
  document.addEventListener('click',e=>{const a=e.target.closest('[data-vip]');if(a){e.preventDefault();e.stopPropagation();const k=a.dataset.vip;
    if(k==='close'){vipClosePanel();return}
    if(k==='zen'){document.body.classList.toggle('vip-zen');save();vipRefresh();return}
    if(k==='smart'){startMix('smart');return}if(k==='disc'){startMix('discovery');return}if(k==='focus'){startMix('focus');return}if(k==='artist'){startMix('artist');return}if(k==='liked'){startMix('liked');return}
    if(k==='note'){promptNote();return}if(k==='share'){shareCurrent();return}if(k==='save'){downloadCurrent();return}
    if(k==='saveq'){const n=prompt('Name this saved queue:','VIP Queue '+new Date().toLocaleDateString());if(n)saveQueue(n);return}if(k==='loadq'){loadQueue(a.dataset.i);return}if(k==='delq'){clearSaved(a.dataset.i);return}
    if(k==='seeknote'){const n=currentNotes().find(x=>String(x.id)===String(a.dataset.i));if(n){au.currentTime=n.t;au.play().catch(()=>{});vipRefresh()};return}
    if(k==='delnote'){noteDel(+a.dataset.i);return}
    if(k==='export'){exportVIP();return}if(k==='queue'){vipClosePanel();ctab='queue';SV('ctab',ctab);cxset(1);rq();return}if(k==='master'){vipClosePanel();view='mst';render(1);return}if(k==='settings'){vipClosePanel();view='set';render(1);return}
    if(k==='shortcuts'){alert('SONORA VIP shortcuts:\n\nSpace Play/Pause\nCtrl/Cmd+K Search\nQ Queue\nN Next\nP Previous\nL Like\nS Shuffle\nR Repeat\n←/→ Seek\n↑/↓ Volume\nM Mute\nV Super VIP\nZ Immersive / undo in Master\nA Master A/B');return}
  }},true);
  document.addEventListener('click',e=>{const a=e.target.closest('[data-a=vip]');if(a){e.preventDefault();e.stopPropagation();vipOpenPanel();}},true);
  document.addEventListener('input',e=>{const id=e.target.dataset.vipNote;if(id&&cur){const n=(V.notes[cur.id]||[]).find(x=>String(x.id)===String(id));if(n){n.x=e.target.value;save()}}});
  document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key.toLowerCase()==='v'){e.preventDefault();vipOpen?vipClosePanel():vipOpenPanel()}if(e.key==='Escape'&&vipOpen)vipClosePanel()});
  setInterval(()=>{if(vipOpen&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))vipRefresh()},1500);
})();

</script></body></html>
